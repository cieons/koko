  <body>
    <h1>koko</h1>
    <p>This koko was built without its web UI. A plain <code>go build</code> or <code>go install</code> leaves it out.</p>
    <p>To build koko with the web UI, run <code>make build</code> in a clone of
      <a href="https://github.com/cieons/koko">github.com/cieons/koko</a>. It needs Go and Node.</p>
    <p>Release binaries always carry the web UI.</p>
  </body>
