name: release

# Pushing a tag such as v0.3.0 publishes the GitHub Release of that version:
# the koko binaries, install.sh and SHA256SUMS listing them, with one
# artifact attestation that covers every asset SHA256SUMS lists (ADR 0026,
# docs/subsystems/release.md). A tag with a pre-release part, such as
# v0.3.0-rc.1, is published as a pre-release, which install.sh installs only
# when KOKO_VERSION names it.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  # The release is built only from a commit that passes every check.
  check:
    uses: ./.github/workflows/check.yml

  # The build runs koko's and npm's code, so it holds no token that can
  # publish or sign.
  build:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/package.json
      - run: make dist
      # Go stamps the version from the tag, but only when the checkout is at
      # the tag with nothing changed; koko version must say the tag.
      - name: The binaries are ${{ github.ref_name }}
        run: test "$(dist/koko-linux-amd64 version --json | jq -r .version)" = "$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # Publishing runs no code of koko's or npm's: it attests and uploads what
  # the build made.
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
      id-token: write # sign the attestation
      attestations: write # store it
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - uses: actions/attest@v4
        with:
          subject-checksums: dist/SHA256SUMS
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=
          case $GITHUB_REF_NAME in *-*) prerelease=--prerelease ;; esac
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --generate-notes $prerelease dist/*
