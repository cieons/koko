name: check

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs it on the tag before building a release.
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # One group for each ref and OS, so a job waiting for a runner holds up
    # only that OS's jobs of later pushes.
    concurrency:
      group: check-${{ github.ref }}-${{ matrix.os }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    # make test bounds each test binary with go test's -timeout, well inside
    # this, so a hanging test fails the job with a goroutine dump instead of
    # being cancelled without a log.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # The Node version is the one web/package.json's devEngines names.
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/package.json
          cache: npm
          cache-dependency-path: web/package-lock.json
      # The action only installs golangci-lint and keeps its cache; make lint
      # runs it, once for each OS koko builds for. It builds golangci-lint
      # with go install, through the Go module proxy, rather than download
      # GitHub's release binary: GitHub's release downloads answered 504 for
      # hours on 2026-11-08 and failed every run before a test ran.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          install-mode: goinstall
          install-only: true
      # The real-OpenSSH test (internal/client/openssh) runs the system's
      # ssh, scp, sftp, sftp-server and rsync, and fails rather than skips
      # without one; macOS ships them all.
      - name: Install the OpenSSH client, sftp-server and rsync
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-client openssh-sftp-server rsync
      # npm ci installs the web UI's dependencies as make would, and npm
      # audit signatures fails on any whose registry signature or provenance
      # attestation does not verify. It needs the registry, so it runs here
      # and make check stays offline; make check then finds them installed.
      - name: Install the web UI's dependencies and verify their signatures
        working-directory: web
        run: |
          npm ci
          npm audit signatures
      - run: make check
