name: check

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs it on the tag before building a release.
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # One group for each ref and OS, so a job waiting for a runner holds up
    # only that OS's jobs of later pushes.
    concurrency:
      group: check-${{ github.ref }}-${{ matrix.os }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    # make test bounds each test binary with go test's -timeout, well inside
    # this, so a hanging test fails the job with a goroutine dump instead of
    # being cancelled without a log. The Ubuntu job takes 8 to 10 minutes
    # and the macOS one 7 to 12 (docs/subsystems/release.md, "The check
    # workflow"), so a slow runner still ends well inside the limit.
    timeout-minutes: 20
    env:
      GOLANGCI_LINT_VERSION: v2.15.0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        id: go
        with:
          go-version-file: go.mod
      # The Node version is the one web/package.json's devEngines names.
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/package.json
          cache: npm
          cache-dependency-path: web/package-lock.json
      # golangci-lint's binary and the cache of its last run, kept from one
      # run to the next: building the binary took 56 to 72 s of every run
      # (#161). A new golangci-lint, Go, or go.mod builds it again.
      - uses: actions/cache@v6
        id: golangci-lint
        with:
          path: |
            ~/go/bin/golangci-lint
            ~/.cache/golangci-lint
            ~/Library/Caches/golangci-lint
          key: golangci-lint-${{ env.GOLANGCI_LINT_VERSION }}-${{ runner.os }}-${{ runner.arch }}-go${{ steps.go.outputs.go-version }}-${{ hashFiles('go.mod') }}
      # The action only installs golangci-lint, where the cache above holds
      # none; make lint runs it, once for each OS koko builds for. It builds
      # golangci-lint with go install, through the Go module proxy, rather
      # than download GitHub's release binary: GitHub's release downloads
      # answered 504 for hours on 2026-11-08 and failed every run before a
      # test ran.
      - uses: golangci/golangci-lint-action@v9
        if: steps.golangci-lint.outputs.cache-hit != 'true'
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          install-mode: goinstall
          install-only: true
          skip-cache: true
      # The real-OpenSSH test (internal/client/openssh) runs the system's
      # ssh, scp, sftp, sftp-server and rsync, and fails rather than skips
      # without one; macOS ships them all, and so does the Ubuntu runner's
      # image today. apt runs only when one is missing: apt-get update waited
      # 3 to 7 minutes for package mirrors whose names did not resolve, to
      # install nothing, and took the job past its limit once (#161).
      - name: Install the OpenSSH client, sftp-server and rsync
        if: runner.os == 'Linux'
        run: |
          missing=
          for tool in ssh scp sftp rsync /usr/lib/openssh/sftp-server; do
            command -v "$tool" >/dev/null || missing="$missing $tool"
          done
          if [ -z "$missing" ]; then
            echo "all installed"
            exit 0
          fi
          echo "missing:$missing"
          sudo apt-get update
          sudo apt-get install -y openssh-client openssh-sftp-server rsync
      # npm ci installs the web UI's dependencies as make would, and npm
      # audit signatures fails on any whose registry signature or provenance
      # attestation does not verify. It needs the registry, so it runs here
      # and make check stays offline; make check then finds them installed.
      - name: Install the web UI's dependencies and verify their signatures
        working-directory: web
        run: |
          npm ci
          npm audit signatures
      - run: make check

  # The CLI's tests on Windows (ADR 0051), against the koko server and Hosts
  # in the test process. It calls go itself: the image has no GNU Make. It
  # runs neither the koko server's own packages, which ship for Linux only,
  # nor the web UI's build and tests, nor lint, which make lint runs for
  # GOOS=windows in the jobs above, and no race detector, which would need
  # a C toolchain there (docs/subsystems/release.md).
  windows:
    runs-on: windows-latest
    concurrency:
      group: check-${{ github.ref }}-windows
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    # go test bounds each test binary at 10 minutes, well inside this, so a
    # hanging test fails the job with a goroutine dump.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # What the image has, for the log: the ssh a command line finds, Git
      # for Windows' own, its sftp-server, and the sh.exe the in-process
      # Host runs a command through.
      - name: Show the ssh clients and the shell
        shell: cmd
        run: |
          where ssh
          ssh -V
          where sh
          "C:\Program Files\Git\usr\bin\ssh.exe" -V
          dir /s /b "C:\Program Files\Git\sftp-server.exe"
          exit /b 0
      - run: go vet ./...
      # Under a throwaway profile, as make test runs under a throwaway
      # HOME, so no test touches the runner's own .ssh or .claude. Go's
      # caches and env file are pinned first, or go would look for them
      # under the new profile.
      - name: Test the CLI
        shell: pwsh
        run: |
          $env:GOENV = go env GOENV
          $env:GOPATH = go env GOPATH
          $env:GOMODCACHE = go env GOMODCACHE
          $env:GOCACHE = go env GOCACHE
          $profile = Join-Path $env:RUNNER_TEMP "koko-profile-$([guid]::NewGuid())"
          $env:USERPROFILE = $profile
          $env:LOCALAPPDATA = Join-Path $profile 'AppData\Local'
          New-Item -ItemType Directory -Force -Path $env:LOCALAPPDATA | Out-Null
          go test -timeout 10m ./cmd/... ./internal/shared/... ./internal/client/... ./internal/harness/... ./release/...
