name: container

# Runs the koko server's image as its Owner would, through the install docs'
# release/compose.yaml, on each platform the image is built for, each on a
# runner of its own platform, natively: the first start, the refusals, a
# device joining, a kill and a restart, recreating the container, a browser
# signing in behind Caddy, and the index's binaries (release/container-check.sh, docs/subsystems/release.md).
# It runs only before a release, which the release workflow runs it on the
# tag for, and by hand (docs/subsystems/release.md, "The check workflow").
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    concurrency:
      group: container-${{ github.ref }}-${{ matrix.runner }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/package.json
          cache: npm
          cache-dependency-path: web/package-lock.json
      # The release's own build: its binaries, then the image the release
      # pushes, both platforms in one index, as the release workflow builds
      # them.
      - run: make dist
      - run: make image
      # skopeo loads this platform's image from the archive into Docker.
      - name: Install skopeo
        run: command -v skopeo >/dev/null || { sudo apt-get update && sudo apt-get install -y skopeo; }
      - name: Start, join, kill, recreate, sign in behind Caddy and refuse
        run: release/container-check.sh dist
