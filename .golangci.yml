version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - misspell
    - noctx
    - paralleltest
    - unconvert
    - usestdlibvars
  settings:
    misspell:
      # signins is the Sign-ins' table and their list's JSON key (ADR 0043).
      ignore-rules:
        - signins
    paralleltest:
      ignore-missing-subtests: true
  exclusions:
    rules:
      # Only the S1 tests run in parallel, each calling t.Parallel() unless
      # it is a TestRealTime test or one Go refuses to run in parallel
      # (docs/subsystems/code-layout.md, "Running the S1 tests").
      - path-except: internal/client/cli/
        linters:
          - paralleltest

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/cieons/koko
